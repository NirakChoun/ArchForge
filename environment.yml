# ArchForge host-side toolchain (conda-forge). Create with:
#   sbatch scripts/setup_env.sh
# gem5 itself is built with the system gcc 11.4 and embeds the system
# Python 3.10 (see docs/stage0.md); this environment supplies SCons and the
# analysis stack. Versions are the ones resolved on 2026-09-27.
name: archforge-env
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - scons=4.8.1
  - pyyaml=6.0.3
  - numpy=2.5.3
  - pandas=2.3.3
  - matplotlib=3.9.4
  - pytest=8.4.2
