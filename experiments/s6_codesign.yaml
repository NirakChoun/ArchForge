# Stage 6: tiling x cache hierarchy, full factorial on O3.
# Software: untiled ikj (the baseline software) and tiled ikj with tile
# 8..64, at N = 320 (2.3 MiB of matrices) and N = 384 (3.4 MiB), both larger
# than the largest L2 tested. Hardware: L1D {16, 32, 64} KiB x L2 {256 KiB,
# 512 KiB, 1 MiB, 2 MiB}; everything else at baseline.
id: s6-codesign
study: stage6_codesign
description: matmul tile size x L1D size x L2 size at two matrix sizes
config: configs/archforge_se.py
time: "00:45:00"   # set from the pilot; see docs/stage6.md
mem: 2G
base: {}
hardware:
  grid:
    l1d-size: [16KiB, 32KiB, 64KiB]
    l2-size: [256KiB, 512KiB, 1MiB, 2MiB]
workloads:
  - {name: matmul, binary: matmul, variant: untiled, input: N320, args: "1 320"}
  - {name: matmul, binary: matmul, variant: t8, input: N320, args: "2 320 8"}
  - {name: matmul, binary: matmul, variant: t12, input: N320, args: "2 320 12"}
  - {name: matmul, binary: matmul, variant: t16, input: N320, args: "2 320 16"}
  - {name: matmul, binary: matmul, variant: t24, input: N320, args: "2 320 24"}
  - {name: matmul, binary: matmul, variant: t32, input: N320, args: "2 320 32"}
  - {name: matmul, binary: matmul, variant: t48, input: N320, args: "2 320 48"}
  - {name: matmul, binary: matmul, variant: t64, input: N320, args: "2 320 64"}
  - {name: matmul, binary: matmul, variant: untiled, input: N384, args: "1 384"}
  - {name: matmul, binary: matmul, variant: t8, input: N384, args: "2 384 8"}
  - {name: matmul, binary: matmul, variant: t12, input: N384, args: "2 384 12"}
  - {name: matmul, binary: matmul, variant: t16, input: N384, args: "2 384 16"}
  - {name: matmul, binary: matmul, variant: t24, input: N384, args: "2 384 24"}
  - {name: matmul, binary: matmul, variant: t32, input: N384, args: "2 384 32"}
  - {name: matmul, binary: matmul, variant: t48, input: N384, args: "2 384 48"}
  - {name: matmul, binary: matmul, variant: t64, input: N384, args: "2 384 64"}
